name: Build unsigned iPhone IPAs

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'img/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APOLLO_IPA_URL: https://downloads.apolloreborn.app/apollobase.ipa
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: brew install ldid dpkg make

      - name: Add GNU make to PATH
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275 # master @ 2026-04-09
          path: theos
          submodules: recursive

      # This Xcode supplies the Makefile's pinned iOS 26.0 release SDK.
      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Build rootful tweak package
        # The .deb is only an intermediate here (and a short-lived PR artifact),
        # so skip Theos's default lzma -9 packaging (~16s on the runner) in
        # favour of the fastest level. Release builds keep the default.
        run: make package FINALPACKAGE=1 THEOS_PLATFORM_DEB_COMPRESSION_LEVEL=1
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Locate rootful package
        id: rootful_deb
        run: |
          DEB_PATH=$(ls -1t packages/*.deb | head -1)
          if [ -z "$DEB_PATH" ]; then
            echo "Error: no rootful .deb produced by make package"
            exit 1
          fi
          echo "deb_path=$DEB_PATH" >> "$GITHUB_OUTPUT"
          echo "Rootful tweak: $DEB_PATH"

      - name: Collect debug symbols
        run: bash ./scripts/collect-debug-symbols.sh --label rootful --output-dir ./dist/symbols

      - name: Install cyan
        run: |
          # cyan = asdfzxcvbn's pyzule-rw IPA injector (builds no-extensions
          # variants). venv needed: runner's Homebrew Python is PEP 668 managed.
          python3 -m venv "$RUNNER_TEMP/cyan-venv"
          "$RUNNER_TEMP/cyan-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/cyan-venv/bin/python" -m pip install \
            "https://github.com/asdfzxcvbn/pyzule-rw/archive/refs/tags/v1.4.4.zip"
          echo "$RUNNER_TEMP/cyan-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cyan-venv/bin/cyan" --help >/dev/null
          echo "cyan installed: $RUNNER_TEMP/cyan-venv/bin/cyan"

      - name: Install xcodegen
        run: |
          # build_release_variants.sh builds and injects ApolloRebornWidgets.appex
          # into the extension-bearing variants. Keep PR artifacts aligned with
          # release artifacts by failing here if the widget toolchain is absent.
          brew install xcodegen
          xcodegen --version

      - name: Restore cached widget extension build
        id: widget_cache
        # The widget appex (+ its dSYM) only depends on widgets/** and the Xcode
        # used to build it, so most PRs can reuse the last build (~45s saved).
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: widgets/build/Build/Products/Release-iphoneos
          key: widget-appex-xcode-26.0.1-${{ hashFiles('widgets/**') }}

      - name: Download Apollo IPA
        run: |
          curl -L --fail --retry 3 "$APOLLO_IPA_URL" -o Apollo.ipa
          unzip -t Apollo.ipa >/dev/null

      - name: Build IPA variants
        # PR builds skip the two GLASS icons-only variants; release builds still
        # produce all six.
        run: |
          WIDGET_ARGS=()
          if [ "${{ steps.widget_cache.outputs.cache-hit }}" = "true" ]; then
            WIDGET_ARGS=(--widget-appex widgets/build/Build/Products/Release-iphoneos/ApolloRebornWidgets.appex)
          fi
          bash ./scripts/build_release_variants.sh \
            --ipa ./Apollo.ipa \
            --deb "${{ steps.rootful_deb.outputs.deb_path }}" \
            --output-dir ./dist/out \
            --no-glass-icons \
            "${WIDGET_ARGS[@]}"

      - name: Validate IPA variants
        run: bash ./scripts/validate_release_variants.sh --no-glass-icons ./dist/out

      - name: Collect widget debug symbols
        run: |
          WIDGET_DSYM="widgets/build/Build/Products/Release-iphoneos/ApolloRebornWidgets.appex.dSYM"
          if [ ! -d "$WIDGET_DSYM" ]; then
            echo "Error: missing widget dSYM: $WIDGET_DSYM" >&2
            exit 1
          fi
          mkdir -p ./dist/symbols/widgets
          cp -R "$WIDGET_DSYM" ./dist/symbols/widgets/

      - name: Publish unsigned IPAs to GitHub Releases
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: unsigned-build-${{ github.run_number }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Unsigned iPhone build ${{ github.run_number }} (attempt ${{ github.run_attempt }})
          draft: false
          prerelease: false
          make_latest: true
          files: dist/out/*.ipa
          fail_on_unmatched_files: true
          body: |
            Download an unsigned .ipa directly from Assets below (no ZIP extraction needed).
            Choose Standard or GLASS (Liquid Glass); NOEXTENSIONS omits widgets and Safari extensions.
            Sign the chosen IPA with your sideloading tool before installing it on your iPhone.
            Built from commit ${{ github.sha }}. No Apple signing certificate is supplied by CI.

      - name: Upload debug symbols
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Apollo-Reborn-symbols-${{ github.run_number }}
          path: dist/symbols
          if-no-files-found: warn
          retention-days: 30

      - name: Download instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Unsigned iPhone packages
          Download an **.ipa** directly from this build's [release](https://github.com/${{ github.repository }}/releases/tag/unsigned-build-${{ github.run_number }}-${{ github.run_attempt }}).
          Choose Standard or GLASS; NOEXTENSIONS omits widgets and Safari extensions.
          Sign the chosen IPA with your sideloading tool before installing it.
          No Apple certificate or provisioning profile is supplied by CI;
          internal ad-hoc signatures may remain for re-signing.
          Release IPAs do not have artifact expiration. Debug symbols remain separate artifacts for 30 days.
          SUMMARY
